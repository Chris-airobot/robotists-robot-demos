name: Web viewer checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run test:motions
      - run: npm run build
